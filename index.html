<!doctype html>
<html lang="zh-HK">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家用檔案分享</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0 auto;
      max-width: 42rem;
      padding: 1.25rem;
      font:
        16px/1.4 ui-sans-serif,
        system-ui,
        sans-serif;
      color: #1a1a1a;
      background: #f4f1ea;
    }
    h1 {
      font-size: 1.15rem;
      margin: 0 0 0.75rem;
    }
    .meta {
      display: grid;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    label.k {
      width: 4.5rem;
      color: #555;
      flex: none;
    }
    input[readonly] {
      flex: 1;
      min-width: 12rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid #c9c3b6;
      background: #fff;
      font: inherit;
    }
    button,
    .btn {
      font: inherit;
      border: 1px solid #1a1a1a;
      background: #1a1a1a;
      color: #fff;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }
    button.ghost {
      background: #fff;
      color: #1a1a1a;
    }
    button.ico {
      padding: 0.35rem;
      line-height: 0;
    }
    .hint {
      color: #666;
      font-size: 0.85rem;
    }
    .bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin: 1rem 0 0.5rem;
      flex-wrap: wrap;
    }
    .upload-state {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .upload-state[hidden] {
      display: none;
    }
    .upload-state progress {
      width: 8rem;
      accent-color: #287a55;
    }
    .upload-state span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .path {
      flex: 1;
      word-break: break-all;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid #c9c3b6;
      background: #fff;
    }
    li {
      display: flex;
      border-top: 1px solid #eee;
    }
    li:first-child {
      border-top: 0;
    }
    li button {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-align: left;
      background: transparent;
      color: inherit;
      border: 0;
      padding: 0.6rem 0.7rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    li button:hover {
      background: #f7f4ee;
    }
    .sz {
      color: #666;
      font-variant-numeric: tabular-nums;
      padding: 0.6rem 0.7rem;
    }
    a.sz {
      color: #1a1a1a;
      text-decoration: none;
      line-height: 0;
      display: flex;
      align-items: center;
    }
    .empty {
      padding: 1.2rem;
      color: #666;
    }
    .snackbar {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      z-index: 1;
      max-width: calc(100vw - 2rem);
      padding: 0.65rem 1rem;
      color: #fff;
      background: #1a1a1a;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 0.5rem);
      transition:
        opacity 160ms ease,
        transform 160ms ease;
    }
    .snackbar.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
  <body>
    <h1>家用檔案分享</h1>
    <div class="meta">
      <div class="row">
        <span class="k">Wi-Fi</span><strong id="ssid">…</strong>
      </div>
      <div class="row">
        <span class="k">網址</span>
        <input id="url" readonly />
        <button type="button" id="copy">複製</button>
      </div>
      <div class="row">
        <span class="k">資料夾</span><span id="folder" class="hint"></span>
      </div>
      <p class="hint">
        第二部機要同一 Wi-Fi，瀏覽器開呢個網址。連唔到先考慮防火牆，唔一定要跑
        netsh。
      </p>
    </div>
    <div class="bar">
      <button type="button" class="ghost" id="updir" hidden>上層</button>
      <span class="path" id="curpath">/</span>
      <span class="file-count hint" id="file-count" aria-live="polite"></span>
      <button type="button" class="ghost ico" id="dldir" aria-label="下載">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"
          />
        </svg>
      </button>
      <label class="btn"
        >上載<input id="file" type="file" multiple hidden
      /></label>
    </div>
    <div class="upload-state" id="upload-state" hidden>
      <progress
        id="upload-progress"
        max="100"
        value="0"
        aria-label="上載進度"
      ></progress>
      <span id="upload-status" role="status" aria-live="polite"></span>
    </div>
    <ul id="list"></ul>
    <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
    <script>
      let cur = "";
      let snackbarTimer;
      const $ = (id) => document.getElementById(id);

      function showSnackbar(message) {
        const snackbar = $("snackbar");
        snackbar.textContent = message;
        snackbar.classList.add("visible");
        clearTimeout(snackbarTimer);
        snackbarTimer = setTimeout(() => {
          snackbar.classList.remove("visible");
        }, 3000);
      }

      async function downloadFile(filePath) {
        try {
          const response = await fetch(
            "/dl?" + new URLSearchParams({ path: filePath }),
          );
          if (!response.ok) throw new Error("download failed");
          const blob = await response.blob();
          const disposition = response.headers.get("content-disposition") || "";
          const encodedName = disposition.match(
            /filename\*=UTF-8''([^;]+)/i,
          )?.[1];
          const filename = encodedName
            ? decodeURIComponent(encodedName)
            : filePath.split("/").pop() || "download";
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showSnackbar("下載完成：" + filename);
        } catch {
          showSnackbar("下載失敗");
        }
      }

      function fmtSize(n) {
        if (n < 1024) return n + " B";
        if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
        if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
        return (n / 1073741824).toFixed(1) + " GB";
      }

      function joinPath(base, name) {
        return base ? base + "/" + name : name;
      }

      async function status() {
        const s = await fetch("/api/status").then((r) => r.json());
        $("ssid").textContent = s.ssid;
        $("url").value = "http://" + s.ip + ":" + s.port;
        $("folder").textContent = s.folder;
      }

      async function load() {
        $("curpath").textContent = "/" + cur;
        $("updir").hidden = !cur;
        const q = new URLSearchParams({ path: cur });
        const r = await fetch("/api/list?" + q);
        const data = await r.json();
        const ul = $("list");
        ul.replaceChildren();
        if (!r.ok) {
          $("file-count").textContent = "";
          ul.append(
            Object.assign(document.createElement("li"), {
              textContent: data.error || "讀取失敗",
              className: "empty",
            }),
          );
          return;
        }
        const fileCount = data.items.filter((item) => !item.dir).length;
        $("file-count").textContent = `${fileCount} 個檔案`;
        if (!data.items.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "空資料夾";
          ul.append(li);
          return;
        }
        for (const it of data.items) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = it.name + (it.dir ? "/" : "");
          btn.onclick = () => {
            if (it.dir) {
              cur = joinPath(cur, it.name);
              load();
            } else {
              downloadFile(joinPath(cur, it.name));
            }
          };
          li.append(btn);
          if (it.dir) {
            const a = document.createElement("a");
            a.className = "sz";
            a.setAttribute("aria-label", "下載");
            a.innerHTML =
              '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>';
            a.href =
              "/dl?" + new URLSearchParams({ path: joinPath(cur, it.name) });
            a.onclick = (event) => {
              event.preventDefault();
              downloadFile(joinPath(cur, it.name));
            };
            li.append(a);
          } else {
            const sz = document.createElement("span");
            sz.className = "sz";
            sz.textContent = fmtSize(it.size);
            li.append(sz);
          }
          ul.append(li);
        }
      }

      $("dldir").onclick = () => downloadFile(cur);

      $("updir").onclick = () => {
        if (!cur) return;
        const i = cur.lastIndexOf("/");
        cur = i === -1 ? "" : cur.slice(0, i);
        load();
      };

      $("copy").onclick = async () => {
        const v = $("url").value;
        try {
          await navigator.clipboard.writeText(v);
        } catch {
          $("url").select();
          document.execCommand("copy");
        }
      };

      function uploadFile(file, onProgress) {
        return new Promise((resolve, reject) => {
          const q = new URLSearchParams({ path: cur, name: file.name });
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/up?" + q);
          xhr.upload.onprogress = (event) => {
            if (event.lengthComputable) onProgress(event.loaded / event.total);
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve();
            else {
              let message;
              try {
                message = JSON.parse(xhr.responseText).error;
              } catch {
                message = xhr.responseText.trim();
              }
              reject(
                new Error(message || xhr.statusText || `HTTP ${xhr.status}`),
              );
            }
          };
          xhr.onerror = () => reject(new Error("網絡連線錯誤"));
          xhr.send(file);
        });
      }

      $("file").onchange = async (e) => {
        const files = [...e.target.files];
        e.target.value = "";
        if (!files.length) return;
        const input = $("file");
        const state = $("upload-state");
        const progress = $("upload-progress");
        const status = $("upload-status");
        input.disabled = true;
        state.hidden = false;
        let uploaded = 0;
        let failedFile;
        let failureMessage;
        try {
          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.textContent = `上載中 ${i + 1}/${files.length}：${file.name} 0%`;
            progress.value = 0;
            try {
              await uploadFile(file, (fraction) => {
                const percent = Math.round(fraction * 100);
                progress.value = percent;
                status.textContent = `上載中 ${i + 1}/${files.length}：${file.name} ${percent}%`;
              });
              uploaded++;
            } catch (error) {
              failedFile = file.name;
              failureMessage = error.message;
              break;
            }
          }
        } finally {
          state.hidden = true;
          input.disabled = false;
          load();
          showSnackbar(
            failedFile
              ? `${uploaded ? `已上載 ${uploaded} 個檔案；` : ""}上載失敗：${failedFile}（${failureMessage}）`
              : `上載完成：${uploaded} 個檔案`,
          );
        }
      };

      status();
      load();
    </script>
  </body>
</html>
