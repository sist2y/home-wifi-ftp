<!doctype html>
<html lang="zh-HK">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家用檔案分享</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0 auto;
      max-width: 42rem;
      padding: 1.25rem;
      font:
        16px/1.4 ui-sans-serif,
        system-ui,
        sans-serif;
      color: #1a1a1a;
      background: #f4f1ea;
    }
    h1 {
      font-size: 1.15rem;
      margin: 0 0 0.75rem;
    }
    .meta {
      display: grid;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    label.k {
      width: 4.5rem;
      color: #555;
      flex: none;
    }
    input[readonly] {
      flex: 1;
      min-width: 12rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid #c9c3b6;
      background: #fff;
      font: inherit;
    }
    button,
    .btn {
      font: inherit;
      border: 1px solid #1a1a1a;
      background: #1a1a1a;
      color: #fff;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }
    button.ghost {
      background: #fff;
      color: #1a1a1a;
    }
    button.ico {
      padding: 0.35rem;
      line-height: 0;
    }
    button.ico svg[hidden] {
      display: none;
    }
    .hint {
      color: #666;
      font-size: 0.85rem;
    }
    .bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin: 1rem 0 0.5rem;
      flex-wrap: wrap;
    }
    .upload-state {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .upload-state[hidden] {
      display: none;
    }
    .upload-state progress {
      width: 8rem;
      accent-color: #287a55;
    }
    .upload-state span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .path {
      flex: 1;
      word-break: break-all;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid #c9c3b6;
      background: #fff;
    }
    li {
      display: flex;
      border-top: 1px solid #eee;
    }
    li:first-child {
      border-top: 0;
    }
    li button {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-align: left;
      background: transparent;
      color: inherit;
      border: 0;
      padding: 0.6rem 0.7rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    li button:hover {
      background: #f7f4ee;
    }
    .sz {
      color: #666;
      font-variant-numeric: tabular-nums;
      padding: 0.6rem 0.7rem;
    }
    a.sz {
      color: #1a1a1a;
      text-decoration: none;
      line-height: 0;
      display: flex;
      align-items: center;
    }
    .empty {
      padding: 1.2rem;
      color: #666;
    }
    #list.grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr));
      gap: 0.45rem;
      border: 0;
      background: transparent;
    }
    #list.grid li {
      flex-direction: column;
      border: 1px solid #c9c3b6;
      background: #fff;
    }
    #list.grid li.empty {
      grid-column: 1 / -1;
    }
    #list.grid li button {
      display: flex;
      flex-direction: column;
      padding: 0;
      white-space: normal;
    }
    #list.grid .thumb,
    #list.grid .ph {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #ece8df;
      display: block;
    }
    #list.grid .ph {
      display: grid;
      place-items: center;
    }
    #list.grid .ph.video {
      background: #333;
    }
    #list.grid .ph.video::after {
      content: "";
      width: 0;
      height: 0;
      border: 8px solid transparent;
      border-left: 14px solid #fff;
      margin-left: 4px;
    }
    #list.grid .name {
      padding: 0.35rem 0.4rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.8rem;
    }
    #preview {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem 1rem;
      background: rgba(0, 0, 0, 0.82);
    }
    #preview[hidden] {
      display: none;
    }
    #preview img,
    #preview video {
      max-width: 100%;
      max-height: calc(100vh - 4rem);
    }
    .preview-bar {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      display: flex;
      gap: 0.4rem;
    }
    button.preview-nav {
      position: absolute;
      top: 50%;
      min-width: 2.75rem;
      padding: 0.35rem 0.6rem;
      font-size: 1.5rem;
      transform: translateY(-50%);
    }
    .preview-count {
      position: absolute;
      top: -0.65rem;
      left: 50%;
      min-width: 1.2rem;
      padding: 0.15rem 0.25rem;
      border: 1px solid #fff;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.7rem;
      line-height: 1;
      transform: translate(-50%, -100%);
      pointer-events: none;
    }
    #preview-prev {
      left: 0.75rem;
    }
    #preview-next {
      right: 0.75rem;
    }
    .snackbar {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      z-index: 1;
      max-width: calc(100vw - 2rem);
      padding: 0.65rem 1rem;
      color: #fff;
      background: #1a1a1a;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 0.5rem);
      transition:
        opacity 160ms ease,
        transform 160ms ease;
    }
    .snackbar.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
  <body>
    <h1>家用檔案分享</h1>
    <div class="meta">
      <div class="row">
        <span class="k">Wi-Fi</span><strong id="ssid">…</strong>
      </div>
      <div class="row">
        <span class="k">網址</span>
        <input id="url" readonly />
        <button type="button" id="copy">複製</button>
      </div>
      <div class="row">
        <span class="k">資料夾</span><span id="folder" class="hint"></span>
      </div>
      <p class="hint">
        第二部機要同一 Wi-Fi，瀏覽器開呢個網址。連唔到先考慮防火牆，唔一定要跑
        netsh。
      </p>
    </div>
    <div class="bar">
      <button type="button" class="ghost" id="updir" hidden>上層</button>
      <span class="path" id="curpath">/</span>
      <span class="file-count hint" id="file-count" aria-live="polite"></span>
      <button
        type="button"
        class="ghost ico"
        id="viewmode"
        aria-label="圖示"
        aria-pressed="false"
      >
        <svg
          id="icon-grid"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"
          />
        </svg>
        <svg
          id="icon-list"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          aria-hidden="true"
          hidden
        >
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
      <button type="button" class="ghost ico" id="dldir" aria-label="下載">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"
          />
        </svg>
      </button>
      <label class="btn"
        >上載<input id="file" type="file" multiple hidden
      /></label>
    </div>
    <div class="upload-state" id="upload-state" hidden>
      <progress
        id="upload-progress"
        max="100"
        value="0"
        aria-label="上載進度"
      ></progress>
      <span id="upload-status" role="status" aria-live="polite"></span>
    </div>
    <ul id="list"></ul>
    <div id="preview" hidden>
      <div class="preview-bar">
        <button type="button" class="ghost" id="preview-dl">下載</button>
        <button type="button" class="ghost" id="preview-close">關閉</button>
      </div>
      <img id="preview-img" alt="" hidden />
      <video id="preview-vid" controls playsinline hidden></video>
      <button
        type="button"
        class="ghost preview-nav"
        id="preview-prev"
        aria-label="上一張"
      >
        <span
          class="preview-count"
          id="preview-before"
          aria-hidden="true"
        ></span
        >&lt;
      </button>
      <button
        type="button"
        class="ghost preview-nav"
        id="preview-next"
        aria-label="下一張"
      >
        <span class="preview-count" id="preview-ahead" aria-hidden="true"></span
        >&gt;
      </button>
    </div>
    <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
    <script>
      let cur = "";
      let snackbarTimer;
      let previewPath = "";
      let previewImages = [];
      let previewIndex = -1;
      let view = localStorage.getItem("view") === "grid" ? "grid" : "list";
      const $ = (id) => document.getElementById(id);
      const DL_SVG =
        '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>';

      function kind(name) {
        if (/\.(jpe?g|png|gif|webp|bmp|avif)$/i.test(name)) return "image";
        if (/\.(mp4|webm|mov|m4v|mkv)$/i.test(name)) return "video";
        return "";
      }

      function ph(type) {
        const d = document.createElement("div");
        d.className = "ph " + (type || "file");
        return d;
      }

      function applyView() {
        const grid = view === "grid";
        $("list").classList.toggle("grid", grid);
        $("icon-grid").hidden = grid;
        $("icon-list").hidden = !grid;
        $("viewmode").setAttribute("aria-label", grid ? "詳細資料" : "圖示");
        $("viewmode").setAttribute("aria-pressed", String(grid));
      }

      function openPreview(filePath, k) {
        previewPath = filePath;
        previewIndex = k === "image" ? previewImages.indexOf(filePath) : -1;
        const img = $("preview-img");
        const vid = $("preview-vid");
        const q = "/view?" + new URLSearchParams({ path: filePath });
        img.hidden = k !== "image";
        vid.hidden = k !== "video";
        $("preview-prev").hidden = k !== "image";
        $("preview-next").hidden = k !== "image";
        $("preview-prev").disabled = previewIndex <= 0;
        $("preview-next").disabled =
          previewIndex < 0 || previewIndex >= previewImages.length - 1;
        const before = Math.max(previewIndex, 0);
        const ahead =
          previewIndex < 0 ? 0 : previewImages.length - previewIndex - 1;
        $("preview-before").textContent = before;
        $("preview-ahead").textContent = ahead;
        $("preview-prev").setAttribute(
          "aria-label",
          `上一張，前面有 ${before} 張相片`,
        );
        $("preview-next").setAttribute(
          "aria-label",
          `下一張，後面有 ${ahead} 張相片`,
        );
        if (k === "image") {
          vid.removeAttribute("src");
          vid.load();
          img.src = q;
        } else {
          img.removeAttribute("src");
          vid.src = q;
        }
        $("preview").hidden = false;
      }

      function movePreview(offset) {
        const nextIndex = previewIndex + offset;
        if (nextIndex < 0 || nextIndex >= previewImages.length) return;
        openPreview(previewImages[nextIndex], "image");
      }

      function closePreview() {
        $("preview").hidden = true;
        $("preview-img").removeAttribute("src");
        const vid = $("preview-vid");
        vid.pause();
        vid.removeAttribute("src");
        vid.load();
      }

      function showSnackbar(message) {
        const snackbar = $("snackbar");
        snackbar.textContent = message;
        snackbar.classList.add("visible");
        clearTimeout(snackbarTimer);
        snackbarTimer = setTimeout(() => {
          snackbar.classList.remove("visible");
        }, 3000);
      }

      function downloadFile(filePath) {
        const a = document.createElement("a");
        a.href = "/dl?" + new URLSearchParams({ path: filePath });
        a.download = "";
        a.click();
      }

      function fmtSize(n) {
        if (n < 1024) return n + " B";
        if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
        if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
        return (n / 1073741824).toFixed(1) + " GB";
      }

      function joinPath(base, name) {
        return base ? base + "/" + name : name;
      }

      async function status() {
        const s = await fetch("/api/status").then((r) => r.json());
        $("ssid").textContent = s.ssid;
        $("url").value = "http://" + s.ip + ":" + s.port;
        $("folder").textContent = s.folder;
      }

      async function load() {
        applyView();
        $("curpath").textContent = "/" + cur;
        $("updir").hidden = !cur;
        const q = new URLSearchParams({ path: cur });
        const r = await fetch("/api/list?" + q);
        const data = await r.json();
        const ul = $("list");
        ul.replaceChildren();
        if (!r.ok) {
          previewImages = [];
          $("file-count").textContent = "";
          ul.append(
            Object.assign(document.createElement("li"), {
              textContent: data.error || "讀取失敗",
              className: "empty",
            }),
          );
          return;
        }
        previewImages = data.items
          .filter((item) => !item.dir && kind(item.name) === "image")
          .map((item) => joinPath(cur, item.name));
        const fileCount = data.items.filter((item) => !item.dir).length;
        $("file-count").textContent = `${fileCount} 個檔案`;
        if (!data.items.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "空資料夾";
          ul.append(li);
          return;
        }
        const grid = view === "grid";
        const frag = document.createDocumentFragment();
        for (const it of data.items) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          const filePath = joinPath(cur, it.name);
          const k = it.dir ? "dir" : kind(it.name);
          btn.onclick = () => {
            if (it.dir) {
              cur = filePath;
              load();
            } else if (grid && k) {
              openPreview(filePath, k);
            } else {
              downloadFile(filePath);
            }
          };
          if (grid) {
            if (k === "image") {
              const img = document.createElement("img");
              img.className = "thumb";
              img.loading = "lazy";
              img.decoding = "async";
              img.alt = "";
              img.src = "/thumb?" + new URLSearchParams({ path: filePath });
              img.onerror = () => {
                img.onerror = null;
                img.replaceWith(ph("image"));
              };
              btn.append(img);
            } else {
              btn.append(ph(k || "file"));
            }
            const name = document.createElement("span");
            name.className = "name";
            name.textContent = it.name + (it.dir ? "/" : "");
            btn.append(name);
            li.append(btn);
          } else {
            btn.textContent = it.name + (it.dir ? "/" : "");
            li.append(btn);
            if (it.dir) {
              const a = document.createElement("a");
              a.className = "sz";
              a.setAttribute("aria-label", "下載");
              a.innerHTML = DL_SVG;
              a.href = "/dl?" + new URLSearchParams({ path: filePath });
              a.download = "";
              li.append(a);
            } else {
              const sz = document.createElement("span");
              sz.className = "sz";
              sz.textContent = fmtSize(it.size);
              li.append(sz);
            }
          }
          frag.append(li);
        }
        ul.append(frag);
      }

      $("viewmode").onclick = () => {
        view = view === "grid" ? "list" : "grid";
        localStorage.setItem("view", view);
        load();
      };

      $("preview-close").onclick = closePreview;
      $("preview-prev").onclick = () => movePreview(-1);
      $("preview-next").onclick = () => movePreview(1);
      $("preview-dl").onclick = () => downloadFile(previewPath);
      $("preview").onclick = (e) => {
        if (e.target === $("preview")) closePreview();
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePreview();
      });

      $("dldir").onclick = () => downloadFile(cur);

      $("updir").onclick = () => {
        if (!cur) return;
        const i = cur.lastIndexOf("/");
        cur = i === -1 ? "" : cur.slice(0, i);
        load();
      };

      $("copy").onclick = async () => {
        const v = $("url").value;
        try {
          await navigator.clipboard.writeText(v);
        } catch {
          $("url").select();
          document.execCommand("copy");
        }
      };

      function uploadFile(file, onProgress) {
        return new Promise((resolve, reject) => {
          const q = new URLSearchParams({ path: cur, name: file.name });
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/up?" + q);
          xhr.upload.onprogress = (event) => {
            if (event.lengthComputable) onProgress(event.loaded / event.total);
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve();
            else {
              let message;
              try {
                message = JSON.parse(xhr.responseText).error;
              } catch {
                message = xhr.responseText.trim();
              }
              reject(
                new Error(message || xhr.statusText || `HTTP ${xhr.status}`),
              );
            }
          };
          xhr.onerror = () => reject(new Error("網絡連線錯誤"));
          xhr.send(file);
        });
      }

      $("file").onchange = async (e) => {
        const files = [...e.target.files];
        e.target.value = "";
        if (!files.length) return;
        const input = $("file");
        const state = $("upload-state");
        const progress = $("upload-progress");
        const status = $("upload-status");
        input.disabled = true;
        state.hidden = false;
        let uploaded = 0;
        let failedFile;
        let failureMessage;
        try {
          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.textContent = `上載中 ${i + 1}/${files.length}：${file.name} 0%`;
            progress.value = 0;
            try {
              await uploadFile(file, (fraction) => {
                const percent = Math.round(fraction * 100);
                progress.value = percent;
                status.textContent = `上載中 ${i + 1}/${files.length}：${file.name} ${percent}%`;
              });
              uploaded++;
            } catch (error) {
              failedFile = file.name;
              failureMessage = error.message;
              break;
            }
          }
        } finally {
          state.hidden = true;
          input.disabled = false;
          load();
          showSnackbar(
            failedFile
              ? `${uploaded ? `已上載 ${uploaded} 個檔案；` : ""}上載失敗：${failedFile}（${failureMessage}）`
              : `上載完成：${uploaded} 個檔案`,
          );
        }
      };

      status();
      load();
    </script>
  </body>
</html>
